name: Public validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked commit
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt

      - name: Install pinned cargo-deny
        run: cargo +1.98.1 install cargo-deny --version 0.20.2 --locked

      - name: Run Rust validation
        run: scripts/validate-rust.sh

  schemas:
    name: Cross-language schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked commit
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check --no-cache-dir --no-input uv==0.12.3

      - name: Install pinned protoc
        env:
          PROTOC_SHA256: 3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8
        run: |
          archive="$RUNNER_TEMP/protoc-21.12-linux-x86_64.zip"
          install_dir="$RUNNER_TEMP/protoc-3.21.12"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip \
            --output "$archive"
          printf '%s  %s\n' "$PROTOC_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          echo "PROTOC_INCLUDE_DIR=$install_dir/include" >> "$GITHUB_ENV"

      - name: Run schema and generated-consumer validation
        run: scripts/validate-schemas.sh

      - name: Verify installed TypeScript package and browser entry
        env:
          CORE_CONTRACTS_GIT_URL: git+file://${{ github.workspace }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/test-typescript-package-consumer.sh "$EXPECTED_SOURCE_SHA"
