[workspace]
resolver = "3"
members = [
  "crates/exact-decimal",
  "crates/domain",
  "crates/pricing",
  "crates/market-contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
